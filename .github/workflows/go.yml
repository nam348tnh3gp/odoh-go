name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify module files are tidy
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Các file sau chưa được gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race
        run: go test -race -count=1 -covermode atomic -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

      - name: Fuzz (short)
        run: |
          go test -run='^$' -fuzz=FuzzUnmarshalDNSMessage -fuzztime=10s . || true
          go test -run='^$' -fuzz=FuzzUnmarshalMessageBody -fuzztime=10s . || true
          go test -run='^$' -fuzz=FuzzUnmarshalConfigs -fuzztime=10s . || true
          go test -run='^$' -fuzz=FuzzDecodeLengthPrefixedSlice -fuzztime=10s . || true